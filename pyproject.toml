[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-self-healing-agent"
version = "0.2.0"
description = "Safe-by-default self-healing Oracle Database agent with a deterministic engineering harness."
requires-python = ">=3.9"
authors = [{ name = "Oracle Self Healing Agent" }]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
oracle = ["oracledb>=2.0"]
dev = []

[project.scripts]
oracle-healer = "oracle_self_healing_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
